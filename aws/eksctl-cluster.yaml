apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: forum-distribuido
  region: us-east-1
  version: "1.30"

availabilityZones:
  - us-east-1a
  - us-east-1b

managedNodeGroups:
  - name: forum-workers
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 2
    maxSize: 4
    privateNetworking: true
    volumeSize: 20
